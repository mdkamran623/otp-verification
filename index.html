<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Verify · OTP</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="orb orb1"></div>
  <div class="orb orb2"></div>

  <div class="card" id="card">
    <div class="icon-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="10" rx="2"></rect>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
      </svg>
    </div>
    <h1>Verify your number</h1>
    <p class="sub">Code sent to <b id="phoneDisplay">+91 98••••••10</b></p>
    <button class="edit-btn" onclick="editNumber()">Wrong number? Edit</button>

    <div class="otp-row" id="otpRow">
      <input type="text" inputmode="numeric" maxlength="1" class="otp-input" data-i="0">
      <input type="text" inputmode="numeric" maxlength="1" class="otp-input" data-i="1">
      <input type="text" inputmode="numeric" maxlength="1" class="otp-input" data-i="2">
      <input type="text" inputmode="numeric" maxlength="1" class="otp-input" data-i="3">
      <input type="text" inputmode="numeric" maxlength="1" class="otp-input" data-i="4">
      <input type="text" inputmode="numeric" maxlength="1" class="otp-input" data-i="5">
    </div>

    <div class="msg" id="msg"></div>

    <button class="verify-btn" id="verifyBtn" onclick="verifyOtp()">
      <span class="label">Verify Code</span>
      <span class="spinner"></span>
    </button>

    <div class="resend-row">
      Didn't get code?
      <button class="resend-link" id="resendBtn" disabled onclick="resendOtp()">Resend in <span id="timer">30</span>s</button>
    </div>

    <div class="success-screen" id="successScreen">
      <div class="check-circle">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
      </div>
      <h2>Verified!</h2>
      <p>Your number has been confirmed successfully.</p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
